    <script>
      const car = document.getElementById("michaelcar")
      const carcam = document.getElementById("carCam")
      const playercam = document.getElementById("playerCam")
      let rotation = car.getAttribute("rotation") // rotation is vector object
      let position = car.getAttribute("position") // rotation is vector object

      
      let fronttires = document.querySelectorAll(".fronttire")
      let backtires = document.querySelectorAll(".backtire")

      let forwardangle = 0

      function moveForward(velocity) {
        forwardangle += velocity;
        console.log(forwardangle)
        let positionx = position.x + velocity*Math.sin(rotation.y * Math.PI/180) 
        let positiony = 1;
        let positionz = position.z + velocity*Math.cos(rotation.y * Math.PI/180)
        return {x: positionx, y:positiony, z:positionz} // returns position of car
      }


      let wkey = 0
      let skey = 0
      let akey = 0
      let dkey = 0
      document.addEventListener("keydown", (e) => {
        if (event.key === "i" || event.key === "I") {
          wkey = 1;
        }
        if (event.key === "k" || event.key === "K") {
          skey = 1;
        }
        if (event.key === "j" || event.key === "J") {
          akey = 1;
        }
        if (event.key === "l" || event.key === "L") {
          dkey = 1;
        }

        if (event.key === " ") {
          if (playercam.getAttribute("active") == "true") {
            playercam.setAttribute("active", false);
            carcam.setAttribute("active", true);
          } else {
            carcam.setAttribute("active", false);
            playercam.setAttribute("active", true);
          }
          
        }
      })
      document.addEventListener("keyup", (e) => {
        if (event.key === "i" || event.key === "I") {
          wkey = 0;
        }
        if (event.key === "k" || event.key === "K") {
          skey = 0;
        }
        if (event.key === "j" || event.key === "J") {
          akey = 0;
        }
        if (event.key === "l" || event.key === "L") {
          dkey = 0;
        }
      })

      let magnitude = 0
      let rotationAngle = 0
      
      function physics() {
        position = car.getAttribute("position")
        rotation = car.getAttribute("rotation")

        magnitude += (wkey - skey) * 0.05
        rotationAngle += (akey-dkey) * 1

        backtires.forEach(tire => {
          tire.setAttribute("rotation", `0 90 ${forwardangle*90}`)
        });

        fronttires.forEach(tire => {
          tire.setAttribute("rotation", `0 ${(rotationAngle*3)+90} ${forwardangle*90}`)
          console.log("set tire")
        });


        let newRotation = rotation.y + (rotationAngle*magnitude)
        car.setAttribute("rotation", `0 ${newRotation} 0`)
        
        
        let newposition = moveForward(magnitude)
        car.setAttribute("position", `${newposition.x} ${newposition.y } ${newposition.z}`)

        //carcam.setAttribute("position", `${position.x} ${position.y+0.5} ${position.z+0.7}`)
        //carcam.setAttribute("rotation", `${rotation.x} ${rotation.y} ${rotation.z}`)
        magnitude *= 0.9
        rotationAngle*= 0.9
        requestAnimationFrame(physics)
      }

      requestAnimationFrame(physics)

    </script>
